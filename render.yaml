# Render Blueprint: app (API + PWA) y su base PostgreSQL, todo en Render, plan gratuito.
# Aviso: la base gratuita de Render vence a los 30 días; para uso real, migrar a un plan pago o a Neon (cambiar DATABASE_URL).
databases:
  - name: fondal-db
    plan: free
    databaseName: fondal
services:
  - type: web
    name: fondal-fit
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fondal-db
          property: connectionString
