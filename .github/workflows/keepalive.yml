name: Fondal Fit keepalive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public health endpoint
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            --connect-timeout 15 --max-time 120 \
            --retry 2 --retry-delay 5 \
            --user-agent 'FondalFit-Keepalive/1.0' \
            'https://fondal-fit.onrender.com/api/health' \
            | grep -Eq '"ok"[[:space:]]*:[[:space:]]*true'
