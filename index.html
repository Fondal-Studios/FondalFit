<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f3a5f">
<title>Arquitecto</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><h1>Arquitecto</h1><p>Relevá tu casa con el celular, obtené el plano y consejos de reforma.</p></header>
<main>
  <section id="scan">
    <h2>1. Relevar</h2>
    <p id="arStatus" class="dim">Comprobando soporte de realidad aumentada…</p>
    <div class="row">
      <label>Nombre <input id="rName" placeholder="Ej: Dormitorio 1"></label>
      <label>Tipo <select id="rType"></select></label>
      <label>Altura (m) <input id="rHeight" type="number" step="0.01" value="2.6"></label>
      <label class="chk"><input id="rWindow" type="checkbox" checked> Tiene ventana</label>
    </div>
    <div class="row">
      <button id="btnAR" disabled>📷 Escanear con cámara (AR)</button>
    </div>
    <details>
      <summary>O cargar medidas a mano (rectángulo)</summary>
      <div class="row">
        <label>Ancho (m) <input id="mW" type="number" step="0.01"></label>
        <label>Largo (m) <input id="mL" type="number" step="0.01"></label>
        <button id="btnManual">Agregar</button>
      </div>
    </details>
  </section>

  <section>
    <h2>2. Plano</h2>
    <svg id="plan" role="img" aria-label="Plano de planta"></svg>
    <p id="totals" class="dim"></p>
    <div class="row">
      <button id="btnSvg">Descargar SVG</button>
      <button id="btnJson">Exportar JSON</button>
      <button id="btnClear" class="ghost">Borrar todo</button>
    </div>
    <ul id="roomList"></ul>
  </section>

  <section>
    <h2>3. Consejos y reformas</h2>
    <p class="note" id="note"></p>
    <div id="findings"></div>
    <div id="reforms"></div>
  </section>
</main>
<div id="arOverlay" hidden>
  <div class="arbar">
    <span id="arMsg">Apuntá al piso</span>
    <button id="arUndo">↶ Deshacer</button>
    <button id="arDone">✔ Terminar</button>
  </div>
  <p class="arhint">Tocá la pantalla en cada esquina del piso, en orden.</p>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
